<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02050A"/>
      <stop offset="0.52" stop-color="#07111F"/>
      <stop offset="1" stop-color="#02070F"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>

    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1030 95) rotate(120) scale(300 360)">
      <stop stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#102238"/>
      <stop offset="1" stop-color="#03070D"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="stars" width="150" height="90" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="20" r="0.8" fill="#BFE7FF" opacity="0.5"/>
      <circle cx="92" cy="48" r="0.6" fill="#D7EEFF" opacity="0.4"/>
      <circle cx="135" cy="12" r="0.7" fill="#8ED5FF" opacity="0.45"/>
      <circle cx="55" cy="76" r="0.5" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="24" fill="url(#ambient)"/>
  <rect width="1200" height="330" rx="24" fill="url(#stars)"/>

  <!-- Subtle city skyline -->
  <g opacity="0.24" fill="#16304A">
    <rect x="720" y="155" width="45" height="95"/>
    <rect x="770" y="132" width="34" height="118"/>
    <rect x="808" y="174" width="58" height="76"/>
    <rect x="870" y="145" width="40" height="105"/>
    <rect x="914" y="116" width="55" height="134"/>
    <rect x="973" y="160" width="38" height="90"/>
    <rect x="1015" y="137" width="70" height="113"/>
    <rect x="1090" y="170" width="50" height="80"/>
  </g>

  <g opacity="0.45" fill="#8CCEFF">
    <rect x="778" y="151" width="3" height="3"/>
    <rect x="887" y="168" width="3" height="3"/>
    <rect x="931" y="137" width="3" height="3"/>
    <rect x="951" y="185" width="3" height="3"/>
    <rect x="1035" y="160" width="3" height="3"/>
    <rect x="1060" y="194" width="3" height="3"/>
  </g>

  <!-- Left accent -->
  <rect x="62" y="72" width="3" height="116" rx="1.5" fill="url(#blueGlow)" filter="url(#glow)"/>

  <!-- Left micro typography -->
  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="5" fill="#8EA3B8">
    <text x="88" y="94" font-size="13">BUILD</text>
    <text x="88" y="123" font-size="13">LEARN</text>
    <text x="88" y="152" font-size="13">IMPROVE</text>
    <text x="88" y="181" font-size="13">REPEAT</text>
  </g>

  <!-- Code symbol -->
  <text x="62" y="232" font-family="Arial, Helvetica, sans-serif" font-size="48"
        fill="#55718F" opacity="0.75">&lt;/&gt;</text>

  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="4" fill="#6E8297">
    <text x="68" y="273" font-size="12">TURNING</text>
    <text x="68" y="297" font-size="12">IDEAS INTO</text>
    <text x="68" y="321" font-size="12">REALITY</text>
  </g>

  <!-- Main title -->
  <text x="430" y="142"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="2"
        fill="#F8FAFC">OMAR LOKMA</text>

  <rect x="430" y="163" width="72" height="3" rx="1.5" fill="#DCEEFF"/>

  <text x="530" y="168"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        letter-spacing="7"
        fill="#B9CBE0">SOFTWARE ENGINEER</text>

  <!-- Lower center kept clean -->
  <path d="M365 276 C560 250 720 258 900 245" stroke="#2563EB" stroke-opacity="0.16" stroke-width="22" filter="url(#blur)"/>
  <path d="M365 276 C560 250 720 258 900 245" stroke="#60A5FA" stroke-opacity="0.42" stroke-width="1.5"/>

  <!-- Desk -->
  <path d="M0 290 C250 272 520 286 760 272 C940 261 1080 268 1200 258 V330 H0Z" fill="url(#desk)"/>

  <!-- Laptop -->
  <g transform="translate(820 188) rotate(-4)">
    <path d="M0 0 L125 0 L145 90 L18 90 Z" fill="#07111D" stroke="#2B8FFF" stroke-width="2"/>
    <path d="M18 90 L145 90 L170 99 L0 99 Z" fill="#09131F" stroke="#1C5F99" stroke-width="1.5"/>
    <path d="M12 8 L116 8 L130 78 L26 78 Z" fill="#03070C"/>
    <path d="M12 8 L116 8 L130 78" stroke="#38BDF8" stroke-opacity="0.25"/>
  </g>

  <!-- Mug -->
  <g transform="translate(705 235)">
    <rect x="0" y="0" width="62" height="58" rx="8" fill="#08121E" stroke="#21384E"/>
    <path d="M62 13 C88 12 88 43 62 42" stroke="#28465F" stroke-width="5" fill="none"/>
    <g font-family="cursive" font-size="10" fill="#B7C9D9">
      <text x="11" y="20">Good</text>
      <text x="11" y="33">Code</text>
      <text x="11" y="46">Better</text>
    </g>
  </g>

  <!-- Books -->
  <g transform="translate(1035 258)">
    <rect x="0" y="0" width="108" height="16" rx="2" fill="#08111B" stroke="#1D3449"/>
    <rect x="6" y="-18" width="102" height="16" rx="2" fill="#091522" stroke="#213A52"/>
    <rect x="-2" y="-36" width="106" height="16" rx="2" fill="#07111C" stroke="#1D3449"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="2" fill="#6E8498">
      <text x="15" y="11">FREEDOM</text>
      <text x="18" y="-7">PROGRESS</text>
      <text x="15" y="-25">DISCIPLINE</text>
    </g>
  </g>

  <!-- Plant -->
  <g transform="translate(1140 170)">
    <path d="M15 68 C8 40 9 18 28 0 C33 28 31 45 15 68Z" fill="#102E35"/>
    <path d="M25 68 C35 35 52 24 65 22 C60 48 45 62 25 68Z" fill="#12373A"/>
    <path d="M22 68 C19 37 25 16 39 7 C44 36 37 55 22 68Z" fill="#174447"/>
    <path d="M5 68 H63 L57 88 H10 Z" fill="#0A1219" stroke="#1C3445"/>
  </g>

  <!-- Right quote -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#A9BED2">
    <text x="970" y="73" font-size="18" letter-spacing="6">“</text>
    <text x="1000" y="82" font-size="12" letter-spacing="4">A BETTER</text>
    <text x="1000" y="106" font-size="12" letter-spacing="4">VERSION</text>
    <text x="1000" y="130" font-size="12" letter-spacing="4">EVERYDAY</text>
    <text x="1134" y="130" font-size="18">”</text>
    <rect x="1000" y="151" width="42" height="2" fill="#7D9AB5"/>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="328" rx="24" stroke="#203246" stroke-width="2"/>
</svg>